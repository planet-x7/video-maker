<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momiji_X</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0 auto;padding:22px 16px 40px;max-width:520px;background:#fff;color:#111;font-family:-apple-system,"Hiragino Sans",sans-serif;counter-reset:n}
h1{text-align:center;font-size:19px;font-weight:700;letter-spacing:.04em;margin:6px 0 22px}
.blk{counter-increment:n;padding:22px 0;border-top:1px solid #efeff2}
#ttlbox .blk{border-top:0;padding-top:4px}
.blk h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.1em;color:#8e8e93}
.blk h2::before{content:"0" counter(n);color:#c2c2c8;letter-spacing:.1em;margin-right:10px}
.blk h2 .ttl{flex:1}
#post .blk,#ttlbox .blk{counter-increment:none}
#post .blk h2::before,#ttlbox .blk h2::before{content:none}
.hb{display:flex;gap:6px}
.btn{display:block;width:100%;border:0;background:#f2f2f4;color:#111;border-radius:99px;padding:12px;font-size:15px;margin-bottom:10px}
.blk>div:last-child .btn{margin-bottom:0}
.sub{border:0;background:#f2f2f4;color:#8e8e93;border-radius:99px;padding:5px 12px;font-size:12px}
.ta{display:block;width:100%;min-height:76px;border:0;background:#f6f6f8;color:#111;border-radius:14px;padding:12px;font-size:16px;margin-bottom:10px;font-family:inherit;resize:none}
.ta.s{min-height:44px}
.ta::placeholder{color:#a0a0a8}
.pv{display:none;width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #e0e0e4;margin:0 0 10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px}
.th{flex:none;width:56px;text-align:center;font-size:11px;color:#8e8e93}
.th img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #e0e0e4}
.th button{display:block;width:100%;border:0;background:#f2f2f4;border-radius:99px;font-size:11px;margin-top:3px;padding:2px 0}
.add{display:block;width:100%;background:transparent;border:0;border-top:1px solid #efeff2;color:#8e8e93;padding:20px 0 22px;font-size:15px;margin-bottom:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:#8e8e93;margin:0 4px 18px;flex-wrap:wrap}
.opt input{width:56px;font-size:15px;text-align:center;border:0;background:#fff;color:#111;border-radius:99px;padding:6px}
.go{display:block;width:100%;border:0;background:#111;color:#fff;border-radius:99px;padding:16px;font-size:16px;font-weight:700}
.go:disabled{opacity:.5}
#st{font-size:13px;text-align:center;color:#8e8e93;min-height:18px;margin:12px 0 0}
#cv{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
#out video{display:block;width:70%;margin:12px auto;border-radius:16px}
#out .go{margin-top:8px}
.hint{font-size:12px;color:#8e8e93;text-align:center}
#cimgs{border-top:1px solid #efeff2;padding-top:20px}
#cimgs .btn{margin:0 0 6px}
.adv{margin:0 4px 16px;color:#8e8e93;font-size:13px}
.adv summary{padding:4px 0}
.cut{display:none;margin:0 0 10px}
.cut.on{display:block}
.cut canvas{width:100%;display:block;margin:8px 0;border-radius:12px;background:#fff;border:1px solid #e0e0e4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.chips .sub.on{background:#111;color:#fff}
.note{font-size:12px;color:#8e8e93;margin:6px 0}
#sets .blk:first-child{border-top:0;padding-top:8px}
.mini{display:flex;gap:6px;margin:0 0 10px}
.mini .sub.on{background:#111;color:#fff}
.hide{display:none!important}
.wipe{display:block;margin:26px auto 0;border:0;background:transparent;color:#a0a0a8;font-size:12px;text-decoration:underline}
</style>
</head>
<body>
<h1>Momiji_X</h1>
<div id="ttlbox"></div>
<div id="post"></div>
<div id="cimgs"></div>
<div id="sets"></div>
<button class="add" id="add">＋ コメントを追加</button>
<div class="opt" style="justify-content:center;gap:36px"><span>速度 <input type="number" id="spd" value="1" step="0.05" min="0.5" max="2"></span><span>間隔 <input type="number" id="gap" value="0.4" step="0.1" min="0"> 秒</span></div>
<details class="adv"><summary>調整</summary><div class="opt" style="margin-top:8px"><span>字幕を早める <input type="number" id="sync" value="0" step="0.05" min="-1" max="2"> 秒</span><span>終わりの余白 <input type="number" id="tail" value="1.5" step="0.5" min="0" max="10"> 秒</span></div></details>
<button class="go" id="go">動画を作る</button>
<p id="st"></p>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="out"></div>
<p class="hint" id="credit"></p>
<button class="wipe" id="wipe" type="button">保存データをすべて消す</button>

<script>
const W=1080,H=1920,BG="#EAFAFF";
const CAP_C=Math.round(H*0.285-110*1.3),IMG_TOP=Math.round(H*0.315);
let FR=0;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const sets=[];
const SPK=2;
const fx1a={fixed:true,lines:["という投稿が/話題になっている"],fixedText:"という投稿が話題になっている",gapAfter:0.2};
const fx1b={fixed:true,lines:["ネットでは"],fixedText:"ネットでは",gapAfter:0.4};
const fx2={fixed:true,lines:["などの反応があった"],fixedText:"などの反応があった",one:true};

function drawBase(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H)}
function wrap(t,max){
  const lines=[];
  for(const part of t.split("/")){
    const chars=[...part];
    if(ctx.measureText(part).width<=max){lines.push(part);continue}
    let best=-1,bw=1e9;
    for(let i=1;i<chars.length;i++){
      const a=ctx.measureText(chars.slice(0,i).join("")).width,b=ctx.measureText(chars.slice(i).join("")).width;
      if(a<=max&&b<=max&&Math.max(a,b)<bw){bw=Math.max(a,b);best=i}
    }
    if(best>0){lines.push(chars.slice(0,best).join(""),chars.slice(best).join(""));continue}
    let cur="";
    for(const ch of chars){
      if(ctx.measureText(cur+ch).width>max&&cur){lines.push(cur);cur=ch}else cur+=ch;
    }
    lines.push(cur);
  }
  return lines;
}
let LI=null,LT=null,LO=null;
function pix(){ctx.fillStyle=(FR++&1)?"#EAFAFF":"#E9FAFF";ctx.fillRect(0,H-6,6,6)}
function drawFrame(img,text,fy,one){
  if(img===LI&&text===LT&&one===LO){pix();return}
  LI=img;LT=text;LO=one;
  drawBase();
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  let fs=110,lines;
  const fam='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  for(;fs>=48;fs-=4){ctx.font="900 "+fs+"px "+fam;lines=wrap(text,W*0.9);if(lines.length<=(one?1:2))break}
  const lh=fs*1.3;
  lines.forEach((l,i)=>ctx.fillText(l,W/2,CAP_C+(i-(lines.length-1)/2)*lh));
  if(img){
    const r=Math.min(W*(img.__post?0.935:1)/img.naturalWidth,(H*0.9-IMG_TOP)/img.naturalHeight);
    const w=img.naturalWidth*r,h=img.naturalHeight*r;
    ctx.drawImage(img,W/2-w/2,IMG_TOP,w,h);
  }
  pix();
}

function fileBtn(label,multi,accept,onpick){
  const wrap=document.createElement("div");
  const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=label;
  const inp=document.createElement("input");inp.type="file";inp.style.display="none";
  if(multi)inp.multiple=true;
  if(accept)inp.accept=accept;
  b.onclick=()=>inp.click();
  inp.onchange=()=>{
    const fl=[...inp.files];
    wrap.set(fl.length?("✓ "+(fl.length>1?fl.length+"枚":fl[0].name.slice(0,18))):label);
    onpick(fl);
  };
  wrap.set=t=>{b.textContent=t};
  wrap.reset=()=>{b.textContent=label;inp.value=""};
  wrap.append(b,inp);return wrap;
}
function insSlash(t){
  const a=t.selectionStart==null?t.value.length:t.selectionStart,b=t.selectionEnd==null?a:t.selectionEnd;
  t.value=t.value.slice(0,a)+"/"+t.value.slice(b);
  t.focus();try{t.setSelectionRange(a+1,a+1)}catch(e){}
  save();
}
function mkTa(ph,cls){const t=document.createElement("textarea");t.className="ta"+(cls?" "+cls:"");t.placeholder=ph;return t}
async function loadImg(f){
  const url=URL.createObjectURL(f),el=new Image();el.src=url;
  try{await el.decode()}catch(_){}
  if(!/jpe?g/i.test(f.type||"")){
    try{
      const k=Math.min(1,256/Math.max(el.naturalWidth,el.naturalHeight));
      const t=document.createElement("canvas");t.width=Math.max(1,Math.round(el.naturalWidth*k));t.height=Math.max(1,Math.round(el.naturalHeight*k));
      const tx=t.getContext("2d");tx.drawImage(el,0,0,t.width,t.height);
      const d=tx.getImageData(0,0,t.width,t.height).data;
      let tr=false;for(let n=3;n<d.length;n+=4){if(d[n]<250){tr=true;break}}
      if(tr){
        const c=document.createElement("canvas");c.width=el.naturalWidth;c.height=el.naturalHeight;
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(el,0,0);
        const blob=await new Promise(r=>c.toBlob(r,"image/png"));
        const u2=URL.createObjectURL(blob),e2=new Image();e2.src=u2;
        try{await e2.decode()}catch(_){}
        return {url:u2,el:e2};
      }
    }catch(e){}
  }
  return {url,el};
}

let ready=false,saveT;
function save(){if(!ready)return;clearTimeout(saveT);saveT=setTimeout(doSave,400)}
const dbp=new Promise((res,rej)=>{const r=indexedDB.open("momijix",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const db=await dbp;return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const db=await dbp;return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function doSave(){
  try{await idbSet("state",{v:2,title:titleTa.value,spd:$("spd").value,gap:$("gap").value,sync:$("sync").value,tail:$("tail").value,
    post:{ta:post.ta.value,rd:post.rd.value,imgs:post.imgs.map(o=>o.file),file:post.file},
    sets:sets.map(s=>({ta:s.ta.value,rd:s.rd.value,img:s.imgFile,file:s.file}))})}catch(e){}
}
document.addEventListener("input",save);

function mkMini(s){
  const d=document.createElement("div");d.className="mini";
  const mkc=t=>{const b=document.createElement("button");b.type="button";b.className="sub";b.textContent=t;d.appendChild(b);return b};
  const b1=mkc("読み上げ修正"),b2=mkc("音声ファイル");
  const set1=v=>{s.rd.classList.toggle("hide",!v);b1.classList.toggle("on",v)};
  const set2=v=>{s.audBtn.classList.toggle("hide",!v);b2.classList.toggle("on",v)};
  b1.onclick=()=>{const v=s.rd.classList.contains("hide");set1(v);if(v)s.rd.focus()};
  b2.onclick=()=>set2(s.audBtn.classList.contains("hide"));
  s.reveal=()=>{if(s.rd.value.trim())set1(true);if(s.file)set2(true)};
  s.hideAll=()=>{set1(false);set2(false)};
  s.hideAll();
  return d;
}
function addSet(){
  const s={img:null,imgFile:null,file:null};
  const card=document.createElement("div");card.className="blk";
  const h=document.createElement("h2");
  h.innerHTML='<span class="ttl"></span><span class="hb"><button class="sub up" type="button">↑</button><button class="sub dn" type="button">↓</button><button class="sub sl" type="button">／</button><button class="sub del" type="button">削除</button></span>';
  const pv=document.createElement("img");pv.className="pv";
  s.ta=mkTa("字幕(改行で字幕を切り替え。／で字幕の中で改行)");s.rd=mkTa("読み上げ修正","s");s.card=card;
  s.imgBtn=fileBtn("画像を選択",false,"image/*",fl=>{if(fl[0])s.setImg(fl[0])});
  s.audBtn=fileBtn("音声ファイルを選択",false,"",fl=>{s.setAudio(fl[0]||null)});
  s.setImg=async f=>{
    const o=await loadImg(f);
    s.img=o.el;s.imgFile=f;pv.src=o.url;pv.style.display="block";
    s.imgBtn.set("✓ "+(f.name||"画像").slice(0,18));save();
  };
  s.setAudio=f=>{s.file=f;s.audBtn.set(f?"✓ "+f.name.slice(0,18):"音声ファイルを選択");if(f&&s.reveal)s.reveal();save()};
  s.clear=()=>{
    s.img=null;s.imgFile=null;s.file=null;pv.style.display="none";
    s.ta.value="";s.rd.value="";s.imgBtn.reset();s.audBtn.reset();s.hideAll();save();
  };
  const mini=mkMini(s);
  card.append(h,s.imgBtn,pv,s.ta,mini,s.rd,s.audBtn);
  h.querySelector(".sl").onclick=()=>insSlash(s.ta);
  h.querySelector(".up").onclick=()=>moveSet(s,-1);
  h.querySelector(".dn").onclick=()=>moveSet(s,1);
  h.querySelector(".del").onclick=()=>{
    if(sets.length<2){s.clear();return}
    sets.splice(sets.indexOf(s),1);card.remove();renum();save();
  };
  sets.push(s);$("sets").appendChild(card);renum();
  return s;
}
function moveSet(s,d){
  const i=sets.indexOf(s),j=i+d;
  if(j<0||j>=sets.length)return;
  [sets[i],sets[j]]=[sets[j],sets[i]];
  sets.forEach(x=>$("sets").appendChild(x.card));
  renum();save();
  s.card.scrollIntoView({block:"center",behavior:"smooth"});
}
const post={imgs:[],file:null,isPost:true,gapAfter:0.2};
function buildCut(s){
  const panel=document.createElement("div");panel.className="cut";
  const shot={img:null,w:0,h:0,taps:[],footer:0,bands:[],d:null,mode:"cut"};
  const sc=document.createElement("canvas"),sx=sc.getContext("2d");
  const note=document.createElement("div");note.className="note";
  const chips=document.createElement("div");chips.className="chips";
  const mk=(t,fn)=>{const b=document.createElement("button");b.type="button";b.className="sub";b.textContent=t;b.onclick=fn;chips.appendChild(b);return b};
  const setMode=m=>{shot.mode=m;bCut.classList.toggle("on",m==="cut");bFoot.classList.toggle("on",m==="foot")};
  const bCut=mk("区切り位置",()=>setMode("cut")),bFoot=mk("下の情報の位置",()=>setMode("foot"));
  mk("1つ戻す",()=>{shot.taps.pop();redraw()});
  mk("全部消す",()=>{shot.taps=[];redraw()});
  const mkb=document.createElement("button");mkb.type="button";mkb.className="btn";mkb.style.cssText="background:#111;color:#fff;margin:8px 0 0";mkb.textContent="画像を作る";
  const isInk=(i)=>shot.d[i]+shot.d[i+1]+shot.d[i+2]<600;
  function analyze(){
    const c=document.createElement("canvas");c.width=shot.w;c.height=shot.h;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(shot.img,0,0,shot.w,shot.h);
    shot.d=x.getImageData(0,0,shot.w,shot.h).data;
    const ink=new Uint8Array(shot.h);
    for(let y=0;y<shot.h;y++){for(let xx=0;xx<shot.w;xx++){if(isInk((y*shot.w+xx)*4)){ink[y]=1;break}}}
    const bands=[];let top=-1,last=-1;
    for(let y=0;y<shot.h;y++){
      if(ink[y]){if(top<0)top=y;last=y}
      else if(top>=0&&y-last>3){bands.push({top,bottom:last});top=-1}
    }
    if(top>=0)bands.push({top,bottom:last});
    shot.bands=bands;
    shot.footer=bands.length>=3?Math.max(0,bands[bands.length-2].top-8):Math.round(shot.h*0.7);
    shot.taps=[];
  }
  function bandAt(y){
    let b=shot.bands[0],bd=1e9;
    for(const q of shot.bands){const dd=y<q.top?q.top-y:(y>q.bottom?y-q.bottom:0);if(dd<bd){bd=dd;b=q}}
    return b;
  }
  function colInk(band,xx){for(let y=band.top;y<=band.bottom;y++){if(isInk((y*shot.w+xx)*4))return true}return false}
  function snapX(band,x){
    x=Math.max(0,Math.min(shot.w-1,Math.round(x)));
    if(!colInk(band,x))return x;
    for(let d=1;d<=60;d++){
      if(x-d>=0&&!colInk(band,x-d))return x-d;
      if(x+d<shot.w&&!colInk(band,x+d))return x+d;
    }
    return x;
  }
  function pt(t){const b=bandAt(t.y);return {band:b,x:snapX(b,t.x),top:Math.max(0,b.top-2),bottom:Math.min(shot.h-1,b.bottom+2)}}
  function redraw(){
    if(!shot.img)return;
    sc.width=shot.w;sc.height=shot.h;
    sx.drawImage(shot.img,0,0,shot.w,shot.h);
    sx.lineWidth=Math.max(3,shot.w/300);
    sx.strokeStyle="#1a8cff";sx.setLineDash([14,10]);
    sx.beginPath();sx.moveTo(0,shot.footer);sx.lineTo(shot.w,shot.footer);sx.stroke();
    sx.setLineDash([]);sx.strokeStyle="#ff3b30";sx.fillStyle="#ff3b30";
    shot.taps=shot.taps.slice().sort((a,b)=>bandAt(a.y).top-bandAt(b.y).top||a.x-b.x);
    shot.taps.forEach((t,i)=>{
      const p=pt(t);
      sx.beginPath();sx.moveTo(p.x,p.top);sx.lineTo(p.x,p.bottom);sx.stroke();
      const r=Math.max(14,shot.w/45);
      sx.beginPath();sx.arc(p.x,p.top,r,0,7);sx.fill();
      sx.fillStyle="#fff";sx.font="bold "+Math.round(r*1.3)+"px sans-serif";sx.textAlign="center";sx.textBaseline="middle";
      sx.fillText(String(i+1),p.x,p.top);sx.fillStyle="#ff3b30";
    });
    const n=shot.taps.length+1;
    note.textContent="区切りたい所(見せたい文字の最後の右側)をタップ。最後の1枚は全文です。区切らない時は、何もしなくて大丈夫です。いま画像"+n+"枚 → 字幕も"+n+"行。青い点線から下は、全部の画像に残ります。";
  }
  sc.onclick=ev=>{
    if(!shot.img)return;
    const r=sc.getBoundingClientRect();
    const x=(ev.clientX-r.left)*sc.width/r.width,y=(ev.clientY-r.top)*sc.height/r.height;
    if(shot.mode==="foot")shot.footer=Math.round(y);else shot.taps.push({x,y});
    redraw();
  };
  async function load(f){
    if(!f){panel.classList.remove("on");return}
    const o=await loadImg(f);
    shot.img=o.el;shot.w=o.el.naturalWidth;shot.h=o.el.naturalHeight;
    analyze();setMode("cut");redraw();panel.classList.add("on");
  }
  mkb.onclick=async()=>{
    if(!shot.img)return;
    const pts=shot.taps.map(pt),files=[];
    for(let i=0;i<=pts.length;i++){
      const c=document.createElement("canvas");c.width=shot.w;c.height=shot.h;
      const x=c.getContext("2d");x.drawImage(shot.img,0,0,shot.w,shot.h);
      if(i<pts.length){
        const p=pts[i];x.fillStyle="#fff";
        x.fillRect(p.x,p.top,shot.w-p.x,p.bottom-p.top+1);
        x.fillRect(0,p.bottom+1,shot.w,Math.max(0,shot.footer-p.bottom-1));
      }
      const blob=await new Promise(r=>c.toBlob(r,"image/png"));
      files.push(new File([blob],"post-"+(i+1)+".png",{type:"image/png"}));
    }
    await s.setImgs(files);
    panel.classList.remove("on");
  };
  panel.append(sc,chips,note,mkb);
  setMode("cut");
  return {panel,load};
}
function buildPost(){
  const s=post;
  const card=document.createElement("div");card.className="blk";
  const h=document.createElement("h2");
  h.innerHTML='<span class="ttl">ポスト本文</span><span class="hb"><button class="sub sl" type="button">／</button><button class="sub del" type="button">削除</button></span>';
  const th=document.createElement("div");th.className="thumbs";
  const render=()=>{
    th.innerHTML="";
    s.imgs.forEach((o,i)=>{
      const d=document.createElement("div");d.className="th";
      d.innerHTML='<img src="'+o.url+'"><div>'+(i+1)+'</div>';
      if(i>0){const b=document.createElement("button");b.type="button";b.textContent="←";b.onclick=()=>{[s.imgs[i-1],s.imgs[i]]=[s.imgs[i],s.imgs[i-1]];render();save()};d.appendChild(b)}
      th.appendChild(d);
    });
  };
  s.ta=mkTa("字幕(1行 = 画像1枚。／で字幕の中で改行)");s.rd=mkTa("読み上げ修正","s");s.card=card;
  const cut=buildCut(s);
  s.imgBtn=fileBtn("画像を選択",true,"image/*",fl=>{s.setImgs(fl);cut.load(fl.length===1?fl[0]:null)});
  s.audBtn=fileBtn("音声ファイルを選択",false,"",fl=>s.setAudio(fl[0]||null));
  s.setImgs=async fl=>{
    s.imgs=[];
    for(const f of fl){const o=await loadImg(f);o.file=f;o.el.__post=true;s.imgs.push(o)}
    render();s.imgBtn.set(fl.length?"✓ "+fl.length+"枚":"画像を選択");save();
  };
  s.setAudio=f=>{s.file=f;s.audBtn.set(f?"✓ "+f.name.slice(0,18):"音声ファイルを選択");if(f&&s.reveal)s.reveal();save()};
  h.querySelector(".sl").onclick=()=>insSlash(s.ta);
  h.querySelector(".del").onclick=()=>{
    s.imgs=[];s.file=null;s.ta.value="";s.rd.value="";render();s.imgBtn.reset();s.audBtn.reset();s.hideAll();cut.load(null);save();
  };
  const mini=mkMini(s);
  card.append(h,s.imgBtn,cut.panel,th,s.ta,mini,s.rd,s.audBtn);
  $("post").appendChild(card);
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function synth(text,speaker){
  for(let n=0;n<6;n++){
    const r=await fetch("https://api.tts.quest/v3/voicevox/synthesis?speaker="+speaker+"&text="+encodeURIComponent(text));
    const j=await r.json();
    if(r.status===429||j.retryAfter){await sleep((j.retryAfter||3)*1000+300);continue}
    if(!j.success)throw new Error("音声の作成に失敗: "+(j.errorMessage||""));
    for(let i=0;i<90;i++){
      const sj=await (await fetch(j.audioStatusUrl)).json();
      if(sj.isAudioError)throw new Error("音声の作成でエラーが出ました");
      if(sj.isAudioReady)break;
      await sleep(1000);
    }
    for(let k=0;k<10;k++){
      const a=await fetch(j.mp3DownloadUrl);
      if(a.ok)return {ab:await a.arrayBuffer(),name:j.speakerName};
      await sleep(1000);
    }
    throw new Error("音声の取得に失敗しました");
  }
  throw new Error("サーバーが混み合っています。少し待ってやり直してください");
}
function stretch(buf,rate,ac){
  if(Math.abs(rate-1)<0.01)return buf;
  const sr=buf.sampleRate,x=buf.getChannelData(0);
  const N=Math.round(sr*0.04)&~1,Hs=N/2,Ha=Hs*rate,D=Math.round(sr*0.012);
  const outLen=Math.ceil(x.length/rate)+N*2;
  const y=new Float32Array(outLen),ws=new Float32Array(outLen),win=new Float32Array(N);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  let prev=0,op=0;
  for(let k=0;;k++){
    const nom=Math.round(k*Ha);
    if(nom>=x.length||op>=outLen-N)break;
    let pos=nom;
    if(k>0){
      const tg=prev+Hs;
      if(tg+N<=x.length){
        let best=-1e30;
        for(let d=-D;d<=D;d+=2){
          const p=nom+d;if(p<0||p+N>x.length)continue;
          let c=0;for(let i=0;i<N;i+=4)c+=x[p+i]*x[tg+i];
          if(c>best){best=c;pos=p}
        }
      }
    }
    for(let i=0;i<N&&pos+i<x.length;i++){y[op+i]+=x[pos+i]*win[i];ws[op+i]+=win[i]}
    prev=pos;op+=Hs;
  }
  const len=Math.max(1,Math.floor(x.length/rate));
  const out=ac.createBuffer(1,len,sr),o=out.getChannelData(0);
  for(let i=0;i<len;i++)o[i]=ws[i]>1e-3?y[i]/ws[i]:0;
  return out;
}
async function restore(){
  let d=null;
  try{d=await idbGet("state")}catch(e){}
  if(d&&d.post){
    titleTa.value=d.title||"";
    $("spd").value=d.spd||1;$("gap").value=d.gap||0.4;
    if(d.v>=2){if(d.sync!=null)$("sync").value=d.sync;if(d.tail!=null)$("tail").value=d.tail}
    post.ta.value=d.post.ta||"";post.rd.value=d.post.rd||"";
    if(d.post.imgs&&d.post.imgs.length)await post.setImgs(d.post.imgs);
    if(d.post.file)post.setAudio(d.post.file);
    post.reveal();
    for(const x of (d.sets&&d.sets.length?d.sets:[{}])){
      const s=addSet();s.ta.value=x.ta||"";s.rd.value=x.rd||"";
      if(x.img)await s.setImg(x.img);
      if(x.file)s.setAudio(x.file);
      s.reveal();
    }
  }else addSet();
  ready=true;
}
restore();drawBase();
$("wipe").onclick=async()=>{
  if(!confirm("入力した内容と選んだ画像・音声をすべて消します。よろしいですか?"))return;
  ready=false;
  try{await idbSet("state",null)}catch(e){}
  location.reload();
};

$("go").onclick=async()=>{
  const st=$("st");
  const active=post.imgs.length>0||post.ta.value.trim()!=="";
  const all=[...(active?[post,fx1a,fx1b]:[]),...sets,fx2];
  const lab=s=>s===post?"ポスト本文":s.fixed?"固定文":"コメント"+(sets.indexOf(s)+1);
  for(const s of all){
    if(s.fixed)continue;
    s.lines=s.ta.value.replace(/\r/g,"").split("\n").map(x=>x.trim().replace(/／/g,"/")).filter(Boolean);
    if(s===post){
      if(!post.imgs.length)return st.textContent="ポスト本文の画像がありません";
      if(!s.lines.length)return st.textContent="ポスト本文の字幕がありません";
      if(s.lines.length!==post.imgs.length)return st.textContent="ポスト本文の字幕の行数("+s.lines.length+")と画像の枚数("+post.imgs.length+")を同じにしてください";
    }else{
      if(!s.img)return st.textContent=lab(s)+"の画像がありません";
      if(!s.lines.length)return st.textContent=lab(s)+"の字幕がありません";
    }
  }
  if(active){
    const lastImg=post.imgs[post.imgs.length-1].el;
    fx1a.img=fx1b.img=lastImg;
  }
  fx2.img=sets[sets.length-1].img;
  $("go").disabled=true;$("out").innerHTML="";
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
    await ac.resume();
    st.textContent="音声を読み込み中…";
    const gap=Math.max(0,parseFloat($("gap").value)||0);
    const spd=Math.min(2,Math.max(0.5,parseFloat($("spd").value)||1));
    const num=(id,d)=>{const v=parseFloat($(id).value);return isNaN(v)?d:v};
    const SYNC=num("sync",0),TAIL=Math.max(0,num("tail",1.5));
    let acc=0;
    for(const s of all){
      const text=(s.fixedText||(s.rd.value.trim()||s.lines.join(""))).replace(/[\/／]/g,"");
      const key=s.file?("f:"+s.file.name+s.file.size):(SPK+"|"+text);
      if(s.key!==key||!s.raw){
        let ab;
        if(s.file){ab=await s.file.arrayBuffer()}
        else{st.textContent=lab(s)+"の音声を作成中…";const r=await synth(text,SPK);ab=r.ab;s.spName=r.name}
        s.raw=await new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej));s.key=key;
      }
      s.buf=stretch(s.raw,spd,ac);
      s.dur=s.buf.duration;s.t0=acc;acc+=s.dur+(s.gapAfter!==undefined?s.gapAfter:gap);
      const tot=s.lines.reduce((a,l)=>a+Math.max(l.replace(/\//g,"").length,1),0);
      let a2=0;
      s.segs=s.lines.map((l,idx)=>{const w=Math.max(l.replace(/\//g,"").length,1);const o={i:idx,text:l,t0:s.t0+a2/tot*s.dur,t1:s.t0+(a2+w)/tot*s.dur};a2+=w;return o});
    }
    const lastS=all[all.length-1];const total=lastS.t0+lastS.dur;
    const frameAt=t=>{
      let cur=all[0];
      for(const s of all){if(s.t0<=t)cur=s}
      const seg=cur.segs.find(g=>t>=g.t0&&t<g.t1)||(t<cur.t0+cur.dur?cur.segs[0]:cur.segs[cur.segs.length-1]);
      return cur.isPost?[post.imgs[seg.i].el,seg.text]:[cur.img,seg.text,undefined,cur.one];
    };
    const dest=ac.createMediaStreamDestination();
    const stream=cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000,audioBitsPerSecond:128000}:{});
    const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const done=new Promise(r=>rec.onstop=r);
    const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*0.001;
    const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;ns.connect(dest);ns.start();
    drawFrame(...frameAt(0));
    rec.start(500);
    const startAt=ac.currentTime+0.15;
    for(const s of all){
      const bs=ac.createBufferSource();bs.buffer=s.buf;bs.connect(dest);bs.start(startAt+s.t0);
    }
    await new Promise(res=>{
      (function loop(){
        const t=ac.currentTime-startAt;
        drawFrame(...frameAt(Math.max(t+SYNC,0)));
        st.textContent="作成中… "+Math.max(0,Math.round(t))+" / "+Math.round(total)+" 秒";
        if(t>=total+TAIL)return res();
        requestAnimationFrame(loop);
      })();
    });
    rec.stop();await done;try{ns.stop()}catch(e){}
    const type=(rec.mimeType||mime||"video/mp4").split(";")[0];
    const ext=type.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type});
    const fname="video."+ext;
    const url=URL.createObjectURL(blob);
    $("out").innerHTML='<video src="'+url+'" controls playsinline></video>';
    const b=document.createElement("button");b.className="go";b.textContent="動画を保存";
    b.onclick=async()=>{
      const file=new File([blob],fname,{type});
      try{
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
        else{const x=document.createElement("a");x.href=url;x.download=fname;x.click()}
      }catch(e){if(!e||e.name!=="AbortError")st.textContent="保存できませんでした。動画を長押しして保存してください"}
    };
    $("out").appendChild(b);
    st.textContent="完成!";
    const vv=$("out").querySelector("video"),expect=total+TAIL+0.15;
    vv.onloadedmetadata=()=>{if(isFinite(vv.duration))st.textContent="完成!(動画 "+vv.duration.toFixed(1)+"秒 / 予定 "+expect.toFixed(1)+"秒)"};
    const names=[...new Set(all.map(x=>x.spName).filter(Boolean))];
    $("credit").textContent=names.length?"クレジット: "+names.join(" / "):"";
  }catch(e){st.textContent="エラー: "+(e&&e.message||e)}
  $("go").disabled=false;
};
