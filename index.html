<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動動画メーカー</title>
<style>
:root{--bg:#f4f6f8;--fg:#111;--card:#fff;--ac:#1a8cff;--bd:#d5dbe1;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--fg:#eee;--card:#1c2127;--bd:#333b44}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;max-width:560px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
label.l{display:block;font-size:13px;margin:8px 0 3px;opacity:.8}
.hint{font-size:12px;opacity:.7;margin:4px 0 0}
textarea{width:100%;min-height:110px;box-sizing:border-box;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input[type=file]{font-size:15px;max-width:100%}
input[type=number]{font-size:16px;width:70px;padding:4px}
button{font-size:16px;padding:12px 16px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;width:100%}
button:disabled{opacity:.5}
button.sub{background:var(--bd);color:var(--fg);width:auto;padding:4px 10px;font-size:13px}
button.add{background:transparent;color:var(--ac);border:2px dashed var(--ac);margin-bottom:12px}
.pv{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--bd);display:none;margin-top:4px}
canvas{width:55%;display:block;margin:8px auto;border-radius:8px;border:1px solid var(--bd)}
#st{font-size:13px;text-align:center;min-height:18px}
video{width:70%;display:block;margin:8px auto}
</style>
</head>
<body>
<h1>自動動画メーカー</h1>
<div id="sets"></div>
<button class="add" id="add">＋ リプライを追加</button>

<div class="card">
<label class="l">背景画像(ライブラリから選択。未選択なら水色)</label>
<input type="file" accept="image/*" id="bg"> <button class="sub" id="bgx" type="button">水色に戻す</button>
<label class="l">読み上げ速度 <input type="number" id="spd" value="1" step="0.05" min="0.5" max="2"> 倍</label>
<p class="hint">声: 四国めたん(固定)</p>
<label class="l">リプライ間の間隔(秒) <input type="number" id="gap" value="0.4" step="0.1" min="0"></label>
<button id="go" style="margin-top:10px">動画を作る</button>
<p id="st"></p>
<canvas id="cv" width="1080" height="1920"></canvas>
<p class="hint">作成中は動画の長さ分かかります。画面を閉じず、スリープさせないでください。</p>
<div id="out"></div>
<p class="hint" id="credit"></p>
</div>

<script>
const W=1080,H=1920,BG="#E8F7FF";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const sets=[];
const SPK=2;
let bgImg=null;

function drawBase(){
  if(bgImg){const r=Math.max(W/bgImg.naturalWidth,H/bgImg.naturalHeight);const w=bgImg.naturalWidth*r,h=bgImg.naturalHeight*r;ctx.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h)}
  else{ctx.fillStyle=BG;ctx.fillRect(0,0,W,H)}
}
function wrap(t,max){
  const lines=[];
  for(const part of t.split("/")){
    let cur="";
    for(const ch of part){
      if(ctx.measureText(cur+ch).width>max&&cur){lines.push(cur);cur=ch}else cur+=ch;
    }
    lines.push(cur);
  }
  return lines;
}
function drawFrame(img,text){
  drawBase();
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  let fs=110,lines;
  const fam='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  for(;fs>=64;fs-=6){ctx.font="900 "+fs+"px "+fam;lines=wrap(text,W*0.88);if(lines.length<=2)break}
  const lh=fs*1.3,cy=H*0.27;
  lines.forEach((l,i)=>{
    const yy=cy+(i-(lines.length-1)/2)*lh;
    if(bgImg){ctx.strokeStyle="#fff";ctx.lineJoin="round";ctx.lineWidth=fs*0.14;ctx.strokeText(l,W/2,yy)}
    ctx.fillStyle="#000";ctx.fillText(l,W/2,yy);
  });
  if(img){
    const by=H*0.36,bh=H*0.52;
    const r=Math.min(W/img.naturalWidth,(H-by)/img.naturalHeight);
    const w=img.naturalWidth*r,h=img.naturalHeight*r;
    ctx.drawImage(img,W/2-w/2,Math.max(by,by+(bh-h)/2),w,h);
  }
}

function addSet(){
  const s={img:null,file:null};
  const card=document.createElement("div");card.className="card";
  card.innerHTML=
   '<h2><span class="ttl"></span><button class="sub del">削除</button></h2>'+
   '<label class="l">画像</label><input type="file" accept="image/*" class="fi"><img class="pv">'+
   '<label class="l">字幕(1行=字幕1枚 / 行内改行は「/」)</label><textarea class="ta" placeholder="そんなつもりなかった&#10;もまじで腹立つ"></textarea>'+
   '<label class="l">読み上げ文(空なら字幕をそのまま読む。読み間違い直し用)</label><textarea class="rd" style="min-height:50px"></textarea>'+
   '<label class="l">自分の音声ファイルを使う場合だけ(任意)</label><input type="file" class="fa">';
  s.card=card;s.ta=card.querySelector(".ta");s.rd=card.querySelector(".rd");
  card.querySelector(".fi").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const url=URL.createObjectURL(f),el=new Image();el.src=url;
    try{await el.decode()}catch(_){}
    s.img=el;const pv=card.querySelector(".pv");pv.src=url;pv.style.display="block";
    drawFrame(el,"プレビュー");
  };
  card.querySelector(".fa").onchange=e=>{s.file=e.target.files[0]||null};
  card.querySelector(".del").onclick=()=>{
    if(sets.length<2)return;
    sets.splice(sets.indexOf(s),1);card.remove();renum();
  };
  sets.push(s);$("sets").appendChild(card);renum();
}
function renum(){
  sets.forEach((s,i)=>{
    s.card.querySelector(".ttl").textContent="リプライ "+(i+1);
    s.card.querySelector(".del").style.display=sets.length>1?"":"none";
  });
}
$("add").onclick=()=>{addSet();sets[sets.length-1].card.scrollIntoView({behavior:"smooth"})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function synth(text,speaker){
  for(let n=0;n<6;n++){
    const r=await fetch("https://api.tts.quest/v3/voicevox/synthesis?speaker="+speaker+"&text="+encodeURIComponent(text));
    const j=await r.json();
    if(r.status===429||j.retryAfter){await sleep((j.retryAfter||3)*1000+300);continue}
    if(!j.success)throw new Error("音声の作成に失敗: "+(j.errorMessage||""));
    for(let i=0;i<90;i++){
      const sj=await (await fetch(j.audioStatusUrl)).json();
      if(sj.isAudioError)throw new Error("音声の作成でエラーが出ました");
      if(sj.isAudioReady)break;
      await sleep(1000);
    }
    for(let k=0;k<10;k++){
      const a=await fetch(j.mp3DownloadUrl);
      if(a.ok)return {ab:await a.arrayBuffer(),name:j.speakerName};
      await sleep(1000);
    }
    throw new Error("音声の取得に失敗しました");
  }
  throw new Error("サーバーが混み合っています。少し待ってやり直してください");
}
function stretch(buf,rate,ac){
  if(Math.abs(rate-1)<0.01)return buf;
  const sr=buf.sampleRate,x=buf.getChannelData(0);
  const N=Math.round(sr*0.04)&~1,Hs=N/2,Ha=Hs*rate,D=Math.round(sr*0.012);
  const outLen=Math.ceil(x.length/rate)+N*2;
  const y=new Float32Array(outLen),ws=new Float32Array(outLen),win=new Float32Array(N);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  let prev=0,op=0;
  for(let k=0;;k++){
    const nom=Math.round(k*Ha);
    if(nom>=x.length||op>=outLen-N)break;
    let pos=nom;
    if(k>0){
      const tg=prev+Hs;
      if(tg+N<=x.length){
        let best=-1e30;
        for(let d=-D;d<=D;d+=2){
          const p=nom+d;if(p<0||p+N>x.length)continue;
          let c=0;for(let i=0;i<N;i+=4)c+=x[p+i]*x[tg+i];
          if(c>best){best=c;pos=p}
        }
      }
    }
    for(let i=0;i<N&&pos+i<x.length;i++){y[op+i]+=x[pos+i]*win[i];ws[op+i]+=win[i]}
    prev=pos;op+=Hs;
  }
  const len=Math.max(1,Math.floor(x.length/rate));
  const out=ac.createBuffer(1,len,sr),o=out.getChannelData(0);
  for(let i=0;i<len;i++)o[i]=ws[i]>1e-3?y[i]/ws[i]:0;
  return out;
}
$("bg").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const el=new Image();el.src=URL.createObjectURL(f);
  try{await el.decode()}catch(_){}
  bgImg=el;drawFrame(sets[0].img,"プレビュー");
};
$("bgx").onclick=()=>{bgImg=null;$("bg").value="";drawFrame(sets[0].img,"プレビュー")};
addSet();drawBase();

$("go").onclick=async()=>{
  const st=$("st");
  // 入力チェック
  for(let i=0;i<sets.length;i++){
    const s=sets[i];
    s.lines=s.ta.value.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
    if(!s.img)return st.textContent="リプライ"+(i+1)+"の画像がありません";
    if(!s.lines.length)return st.textContent="リプライ"+(i+1)+"の字幕がありません";
  }
  $("go").disabled=true;$("out").innerHTML="";
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
    await ac.resume();
    st.textContent="音声を読み込み中…";
    const gap=Math.max(0,parseFloat($("gap").value)||0);
    const spd=Math.min(2,Math.max(0.5,parseFloat($("spd").value)||1));
    let acc=0;
    for(const s of sets){
      const i=sets.indexOf(s);
      const text=(s.rd.value.trim()||s.lines.join("")).replace(/\//g,"");
      const key=s.file?("f:"+s.file.name+s.file.size):(SPK+"|"+text);
      if(s.key!==key||!s.raw){
        let ab;
        if(s.file){ab=await s.file.arrayBuffer()}
        else{st.textContent="リプライ"+(i+1)+"の音声を作成中…";const r=await synth(text,SPK);ab=r.ab;s.spName=r.name}
        s.raw=await new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej));s.key=key;
      }
      s.buf=stretch(s.raw,spd,ac);
      s.dur=s.buf.duration;s.t0=acc;acc+=s.dur+gap;
      const tot=s.lines.reduce((a,l)=>a+Math.max(l.replace(/\//g,"").length,1),0);
      let a2=0;
      s.segs=s.lines.map(l=>{const w=Math.max(l.replace(/\//g,"").length,1);const o={text:l,t0:s.t0+a2/tot*s.dur,t1:s.t0+(a2+w)/tot*s.dur};a2+=w;return o});
    }
    const total=acc-gap;
    const frameAt=t=>{
      let cur=sets[0];
      for(const s of sets){if(s.t0<=t)cur=s}
      let seg=cur.segs.find(g=>t>=g.t0&&t<g.t1)||(t<cur.t0+cur.dur?cur.segs[0]:cur.segs[cur.segs.length-1]);
      return [cur.img,seg.text];
    };
    const dest=ac.createMediaStreamDestination();
    const stream=cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});
    const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const done=new Promise(r=>rec.onstop=r);
    drawFrame(...frameAt(0));
    rec.start(500);
    const startAt=ac.currentTime+0.15;
    for(const s of sets){
      const bs=ac.createBufferSource();bs.buffer=s.buf;bs.connect(dest);bs.start(startAt+s.t0);
    }
    await new Promise(res=>{
      (function loop(){
        const t=ac.currentTime-startAt;
        drawFrame(...frameAt(Math.max(t,0)));
        st.textContent="作成中… "+Math.max(0,Math.round(t))+" / "+Math.round(total)+" 秒";
        if(t>=total+0.4)return res();
        requestAnimationFrame(loop);
      })();
    });
    rec.stop();await done;
    const type=(rec.mimeType||mime||"video/mp4").split(";")[0];
    const ext=type.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type});
    const fname="video."+ext;
    const url=URL.createObjectURL(blob);
    $("out").innerHTML='<video src="'+url+'" controls playsinline></video>';
    const b=document.createElement("button");b.textContent="動画を保存(「ビデオを保存」を選ぶ)";
    b.onclick=async()=>{
      const file=new File([blob],fname,{type});
      try{
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
        else{const x=document.createElement("a");x.href=url;x.download=fname;x.click()}
      }catch(e){if(!e||e.name!=="AbortError")st.textContent="保存できませんでした。動画を長押しして保存してください"}
    };
    $("out").appendChild(b);
    st.textContent="完成!";
    const names=[...new Set(sets.map(x=>x.spName).filter(Boolean))];
    $("credit").textContent=names.length?"投稿に入れるクレジット: "+names.join(" / "):"";
  }catch(e){st.textContent="エラー: "+(e&&e.message||e)}
  $("go").disabled=false;
};
</script>
</body>
</html>
