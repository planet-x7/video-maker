<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momiji_X</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0 auto;padding:22px 16px 40px;max-width:520px;background:#f2f2f4;color:#111;font-family:-apple-system,"Hiragino Sans",sans-serif;counter-reset:n}
h1{text-align:center;font-size:19px;font-weight:700;letter-spacing:.04em;margin:6px 0 22px}
.blk{counter-increment:n;background:#fff;border-radius:28px;padding:20px;margin-bottom:14px}
.blk h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:14px;font-weight:600;color:#8e8e93}
.blk h2::before{content:"0" counter(n);color:#c2c2c8;letter-spacing:.1em;margin-right:10px}
.blk h2 .ttl{flex:1}
#post .blk{counter-increment:none}
#post .blk h2::before{content:none}
.btn{display:block;width:100%;border:0;background:#f2f2f4;color:#111;border-radius:99px;padding:12px;font-size:15px;margin-bottom:10px}
.blk>div:last-child .btn{margin-bottom:0}
.sub{border:0;background:#f2f2f4;color:#8e8e93;border-radius:99px;padding:5px 12px;font-size:12px}
.ta{display:block;width:100%;min-height:76px;border:0;background:#f6f6f8;color:#111;border-radius:14px;padding:12px;font-size:16px;margin-bottom:10px;font-family:inherit;resize:none}
.ta.s{min-height:44px}
.ta::placeholder{color:#a0a0a8}
.pv{display:none;width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #e0e0e4;margin:0 0 10px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px}
.th{flex:none;width:56px;text-align:center;font-size:11px;color:#8e8e93}
.th img{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid #e0e0e4}
.th button{display:block;width:100%;border:0;background:#f2f2f4;border-radius:99px;font-size:11px;margin-top:3px;padding:2px 0}
.add{display:block;width:100%;background:transparent;border:2px dashed #c9c9d0;color:#8e8e93;border-radius:99px;padding:12px;font-size:15px;margin-bottom:18px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:#8e8e93;margin:0 4px 18px;flex-wrap:wrap}
.opt input{width:56px;font-size:15px;text-align:center;border:0;background:#fff;color:#111;border-radius:99px;padding:6px}
.go{display:block;width:100%;border:0;background:#111;color:#fff;border-radius:99px;padding:16px;font-size:16px;font-weight:700}
.go:disabled{opacity:.5}
#st{font-size:13px;text-align:center;color:#8e8e93;min-height:18px;margin:12px 0 0}
#cv{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}
#out video{display:block;width:70%;margin:12px auto;border-radius:16px}
#out .go{margin-top:8px}
.hint{font-size:12px;color:#8e8e93;text-align:center}
</style>
</head>
<body>
<h1>Momiji_X</h1>
<div id="post"></div>
<div id="sets"></div>
<button class="add" id="add">＋ コメントを追加</button>
<div class="opt"><span>話者 : 四国めたん</span><span>速度 <input type="number" id="spd" value="1" step="0.05" min="0.5" max="2"></span><span>間隔 <input type="number" id="gap" value="0.4" step="0.1" min="0"> 秒</span></div>
<button class="go" id="go">動画を作る</button>
<p id="st"></p>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="out"></div>
<p class="hint" id="credit"></p>

<script>
const W=1080,H=1920,BG="#EAFAFF";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const sets=[];
const SPK=2;
const FX1="という投稿が話題になっている/ネットでは",FX2="などの反応があった";
const fx1={fixed:true,lines:[FX1],fixedText:"という投稿が話題になっている。ネットでは"};
const fx2={fixed:true,lines:[FX2],fixedText:FX2};

function drawBase(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H)}
function wrap(t,max){
  const lines=[];
  for(const part of t.split("/")){
    let cur="";
    for(const ch of part){
      if(ctx.measureText(cur+ch).width>max&&cur){lines.push(cur);cur=ch}else cur+=ch;
    }
    lines.push(cur);
  }
  return lines;
}
function drawFrame(img,text,fy){
  drawBase();
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  let fs=110,lines;
  const fam='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  for(;fs>=64;fs-=6){ctx.font="900 "+fs+"px "+fam;lines=wrap(text,W*0.88);if(lines.length<=2)break}
  const lh=fs*1.3,cy=H*0.27;
  lines.forEach((l,i)=>ctx.fillText(l,W/2,cy+(i-(lines.length-1)/2)*lh));
  if(img){
    const by=H*0.36,bh=H*0.52;
    const r=Math.min(W/img.naturalWidth,(H-by)/img.naturalHeight);
    const w=img.naturalWidth*r,h=img.naturalHeight*r;
    ctx.drawImage(img,W/2-w/2,fy!==undefined?fy:Math.max(by,by+(bh-h)/2),w,h);
  }
}

function fileBtn(label,multi,accept,onpick){
  const wrap=document.createElement("div");
  const b=document.createElement("button");b.type="button";b.className="btn";b.textContent=label;
  const inp=document.createElement("input");inp.type="file";inp.style.display="none";
  if(multi)inp.multiple=true;
  if(accept)inp.accept=accept;
  b.onclick=()=>inp.click();
  inp.onchange=()=>{
    const n=inp.files.length;
    b.textContent=n?("✓ "+(n>1?n+"枚":inp.files[0].name.slice(0,18))):label;
    onpick(inp.files);
  };
  wrap.append(b,inp);return wrap;
}
function mkTa(ph,cls){const t=document.createElement("textarea");t.className="ta"+(cls?" "+cls:"");t.placeholder=ph;return t}
async function loadImg(f){
  const url=URL.createObjectURL(f),el=new Image();el.src=url;
  try{await el.decode()}catch(_){}
  return {url,el};
}

function addSet(){
  const s={img:null,file:null};
  const card=document.createElement("div");card.className="blk";
  const h=document.createElement("h2");
  h.innerHTML='<span class="ttl"></span><button class="sub del" type="button">削除</button>';
  const pv=document.createElement("img");pv.className="pv";
  s.ta=mkTa("字幕");s.rd=mkTa("読み上げ修正","s");s.card=card;
  card.append(h,
    fileBtn("画像を選択",false,"image/*",async fl=>{
      if(!fl[0])return;
      const o=await loadImg(fl[0]);s.img=o.el;pv.src=o.url;pv.style.display="block";
    }),
    pv,s.ta,s.rd,
    fileBtn("音声ファイルを選択",false,"",fl=>{s.file=fl[0]||null}));
  h.querySelector(".del").onclick=()=>{
    if(sets.length<2)return;
    sets.splice(sets.indexOf(s),1);card.remove();renum();
  };
  sets.push(s);$("sets").appendChild(card);renum();
}
const post={imgs:[],file:null,isPost:true};
function buildPost(){
  const s=post;
  const card=document.createElement("div");card.className="blk";
  const h=document.createElement("h2");h.innerHTML='<span class="ttl">ポスト本文</span>';
  const th=document.createElement("div");th.className="thumbs";
  const render=()=>{
    th.innerHTML="";
    s.imgs.forEach((o,i)=>{
      const d=document.createElement("div");d.className="th";
      d.innerHTML='<img src="'+o.url+'"><div>'+(i+1)+'</div>';
      if(i>0){const b=document.createElement("button");b.type="button";b.textContent="←";b.onclick=()=>{[s.imgs[i-1],s.imgs[i]]=[s.imgs[i],s.imgs[i-1]];render()};d.appendChild(b)}
      th.appendChild(d);
    });
  };
  s.ta=mkTa("字幕(1行 = 画像1枚)");s.rd=mkTa("読み上げ修正","s");s.card=card;
  card.append(h,
    fileBtn("画像を選択",true,"image/*",async fl=>{
      s.imgs=[];
      for(const f of fl)s.imgs.push(await loadImg(f));
      render();
    }),
    th,s.ta,s.rd,
    fileBtn("音声ファイルを選択",false,"",fl=>{s.file=fl[0]||null}));
  $("post").appendChild(card);
}
buildPost();
function renum(){
  sets.forEach((s,i)=>{
    s.card.querySelector(".ttl").textContent="コメント "+(i+1);
    s.card.querySelector(".del").style.display=sets.length>1?"":"none";
  });
}
$("add").onclick=()=>{addSet();sets[sets.length-1].card.scrollIntoView({behavior:"smooth"})};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function synth(text,speaker){
  for(let n=0;n<6;n++){
    const r=await fetch("https://api.tts.quest/v3/voicevox/synthesis?speaker="+speaker+"&text="+encodeURIComponent(text));
    const j=await r.json();
    if(r.status===429||j.retryAfter){await sleep((j.retryAfter||3)*1000+300);continue}
    if(!j.success)throw new Error("音声の作成に失敗: "+(j.errorMessage||""));
    for(let i=0;i<90;i++){
      const sj=await (await fetch(j.audioStatusUrl)).json();
      if(sj.isAudioError)throw new Error("音声の作成でエラーが出ました");
      if(sj.isAudioReady)break;
      await sleep(1000);
    }
    for(let k=0;k<10;k++){
      const a=await fetch(j.mp3DownloadUrl);
      if(a.ok)return {ab:await a.arrayBuffer(),name:j.speakerName};
      await sleep(1000);
    }
    throw new Error("音声の取得に失敗しました");
  }
  throw new Error("サーバーが混み合っています。少し待ってやり直してください");
}
function stretch(buf,rate,ac){
  if(Math.abs(rate-1)<0.01)return buf;
  const sr=buf.sampleRate,x=buf.getChannelData(0);
  const N=Math.round(sr*0.04)&~1,Hs=N/2,Ha=Hs*rate,D=Math.round(sr*0.012);
  const outLen=Math.ceil(x.length/rate)+N*2;
  const y=new Float32Array(outLen),ws=new Float32Array(outLen),win=new Float32Array(N);
  for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  let prev=0,op=0;
  for(let k=0;;k++){
    const nom=Math.round(k*Ha);
    if(nom>=x.length||op>=outLen-N)break;
    let pos=nom;
    if(k>0){
      const tg=prev+Hs;
      if(tg+N<=x.length){
        let best=-1e30;
        for(let d=-D;d<=D;d+=2){
          const p=nom+d;if(p<0||p+N>x.length)continue;
          let c=0;for(let i=0;i<N;i+=4)c+=x[p+i]*x[tg+i];
          if(c>best){best=c;pos=p}
        }
      }
    }
    for(let i=0;i<N&&pos+i<x.length;i++){y[op+i]+=x[pos+i]*win[i];ws[op+i]+=win[i]}
    prev=pos;op+=Hs;
  }
  const len=Math.max(1,Math.floor(x.length/rate));
  const out=ac.createBuffer(1,len,sr),o=out.getChannelData(0);
  for(let i=0;i<len;i++)o[i]=ws[i]>1e-3?y[i]/ws[i]:0;
  return out;
}
addSet();drawBase();

$("go").onclick=async()=>{
  const st=$("st");
  const active=post.imgs.length>0||post.ta.value.trim()!=="";
  const all=[...(active?[post,fx1]:[]),...sets,fx2];
  const lab=s=>s===post?"ポスト本文":s.fixed?"固定文":"コメント"+(sets.indexOf(s)+1);
  for(const s of all){
    if(s.fixed)continue;
    s.lines=s.ta.value.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean);
    if(s===post){
      if(!post.imgs.length)return st.textContent="ポスト本文の画像がありません";
      if(!s.lines.length)return st.textContent="ポスト本文の字幕がありません";
      if(s.lines.length!==post.imgs.length)return st.textContent="ポスト本文の字幕の行数("+s.lines.length+")と画像の枚数("+post.imgs.length+")を同じにしてください";
    }else{
      if(!s.img)return st.textContent=lab(s)+"の画像がありません";
      if(!s.lines.length)return st.textContent=lab(s)+"の字幕がありません";
    }
  }
  let postY;
  if(active){
    const by=H*0.36,bh=H*0.52;let mh=0;
    for(const o of post.imgs){const r=Math.min(W/o.el.naturalWidth,(H-by)/o.el.naturalHeight);mh=Math.max(mh,o.el.naturalHeight*r)}
    postY=Math.max(by,by+(bh-mh)/2);
    fx1.img=post.imgs[post.imgs.length-1].el;fx1.fy=postY;
  }
  fx2.img=sets[sets.length-1].img;
  $("go").disabled=true;$("out").innerHTML="";
  try{
    const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
    await ac.resume();
    st.textContent="音声を読み込み中…";
    const gap=Math.max(0,parseFloat($("gap").value)||0);
    const spd=Math.min(2,Math.max(0.5,parseFloat($("spd").value)||1));
    let acc=0;
    for(const s of all){
      const text=(s.fixedText||(s.rd.value.trim()||s.lines.join(""))).replace(/\//g,"");
      const key=s.file?("f:"+s.file.name+s.file.size):(SPK+"|"+text);
      if(s.key!==key||!s.raw){
        let ab;
        if(s.file){ab=await s.file.arrayBuffer()}
        else{st.textContent=lab(s)+"の音声を作成中…";const r=await synth(text,SPK);ab=r.ab;s.spName=r.name}
        s.raw=await new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej));s.key=key;
      }
      s.buf=stretch(s.raw,spd,ac);
      s.dur=s.buf.duration;s.t0=acc;acc+=s.dur+gap;
      const tot=s.lines.reduce((a,l)=>a+Math.max(l.replace(/\//g,"").length,1),0);
      let a2=0;
      s.segs=s.lines.map((l,idx)=>{const w=Math.max(l.replace(/\//g,"").length,1);const o={i:idx,text:l,t0:s.t0+a2/tot*s.dur,t1:s.t0+(a2+w)/tot*s.dur};a2+=w;return o});
    }
    const total=acc-gap;
    const frameAt=t=>{
      let cur=all[0];
      for(const s of all){if(s.t0<=t)cur=s}
      const seg=cur.segs.find(g=>t>=g.t0&&t<g.t1)||(t<cur.t0+cur.dur?cur.segs[0]:cur.segs[cur.segs.length-1]);
      return cur.isPost?[post.imgs[seg.i].el,seg.text,postY]:[cur.img,seg.text,cur.fy];
    };
    const dest=ac.createMediaStreamDestination();
    const stream=cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
    const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});
    const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const done=new Promise(r=>rec.onstop=r);
    drawFrame(...frameAt(0));
    rec.start(500);
    const startAt=ac.currentTime+0.15;
    for(const s of all){
      const bs=ac.createBufferSource();bs.buffer=s.buf;bs.connect(dest);bs.start(startAt+s.t0);
    }
    await new Promise(res=>{
      (function loop(){
        const t=ac.currentTime-startAt;
        drawFrame(...frameAt(Math.max(t,0)));
        st.textContent="作成中… "+Math.max(0,Math.round(t))+" / "+Math.round(total)+" 秒";
        if(t>=total+0.4)return res();
        requestAnimationFrame(loop);
      })();
    });
    rec.stop();await done;
    const type=(rec.mimeType||mime||"video/mp4").split(";")[0];
    const ext=type.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type});
    const fname="video."+ext;
    const url=URL.createObjectURL(blob);
    $("out").innerHTML='<video src="'+url+'" controls playsinline></video>';
    const b=document.createElement("button");b.className="go";b.textContent="動画を保存";
    b.onclick=async()=>{
      const file=new File([blob],fname,{type});
      try{
        if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
        else{const x=document.createElement("a");x.href=url;x.download=fname;x.click()}
      }catch(e){if(!e||e.name!=="AbortError")st.textContent="保存できませんでした。動画を長押しして保存してください"}
    };
    $("out").appendChild(b);
    st.textContent="完成!";
    const names=[...new Set(all.map(x=>x.spName).filter(Boolean))];
    $("credit").textContent=names.length?"クレジット: "+names.join(" / "):"";
  }catch(e){st.textContent="エラー: "+(e&&e.message||e)}
  $("go").disabled=false;
};
</script>
</body>
</html>
